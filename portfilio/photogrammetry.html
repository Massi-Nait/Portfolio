<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Photogrammetry — Massinissa Nait</title>

    <meta
        name="description"
        content="Photogrammetry and archaeological documentation by Massinissa Nait."
    >

    <!-- =====================================================
         FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         MODEL VIEWER
    ====================================================== -->

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"
    ></script>


    <style>

        /* =================================================
           ROOT
        ================================================= */

        :root {

            --paper: #f0ebe3;
            --ink: #1a1916;
            --muted: #6e6a61;
            --line: #c9c2b6;
            --accent: #8a5039;
            --accent-soft: rgba(138, 80, 57, .12);

        }


        /* =================================================
           RESET
        ================================================= */

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            background-color: var(--paper);

            color: var(--ink);

            font-family:
                "DM Sans",
                system-ui,
                sans-serif;

            overflow-x: hidden;

            line-height: 1.5;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");

        }


        a {

            color: inherit;

            text-decoration: none;

        }


        button,
        input,
        textarea,
        select {

            font: inherit;

        }


        /* =================================================
           CONTAINER
        ================================================= */

        .container {

            width: min(1220px, 92%);

            margin: auto;

        }


        /* =================================================
           PAGE REVEAL
        ================================================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background: var(--ink);

            z-index: 9999;

            pointer-events: none;

            animation:
                pageReveal
                1s
                cubic-bezier(.77,0,.18,1)
                forwards;

        }


        @keyframes pageReveal {

            from {

                transform: translateY(0);

            }

            to {

                transform: translateY(-100%);

            }

        }


        /* =================================================
           HEADER
        ================================================= */

        header {

            height: 80px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom:
                1px solid var(--line);

        }


        .logo {

            font-size: 11px;

            font-weight: 600;

            letter-spacing: .16em;

            text-transform: uppercase;

        }


        .navigation {

            display: flex;

            gap: 36px;

        }


        .navigation a {

            position: relative;

            font-size: 10px;

            letter-spacing: .16em;

            text-transform: uppercase;

            padding-bottom: 5px;

        }


        .navigation a::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: 0;

            width: 0;

            height: 1px;

            background: var(--accent);

            transition: width .3s ease;

        }


        .navigation a:hover::after,
        .navigation a:focus-visible::after {

            width: 100%;

        }


        /* =================================================
           PAGE INTRO
        ================================================= */

        .page-intro {

            padding: 110px 0 90px;

            display: grid;

            grid-template-columns:
                1fr 2.1fr;

            gap: 5vw;

            border-bottom:
                1px solid var(--line);

        }


        .page-intro-label {

            color: var(--accent);

            font-size: 10px;

            letter-spacing: .18em;

            text-transform: uppercase;

        }


        .page-intro h1 {

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size:
                clamp(65px, 8.5vw, 118px);

            font-weight: 500;

            line-height: .84;

            letter-spacing: -.055em;

        }


        .page-intro p {

            max-width: 650px;

            margin-top: 42px;

            color: var(--muted);

            font-size: 16px;

            line-height: 1.75;

        }


        /* =================================================
           PROJECTS
        ================================================= */

        .projects {

            padding: 110px 0 120px;

        }


        /* =================================================
           PROJECT
        ================================================= */

        .project {

            margin-bottom: 170px;

        }


        .project:last-child {

            margin-bottom: 0;

        }


        /* =================================================
           PROJECT HEADER
        ================================================= */

        .project-header {

            display: grid;

            grid-template-columns:
                90px 1.2fr 1fr;

            gap: 30px;

            align-items: end;

            margin-bottom: 32px;

        }


        .project-number {

            color: var(--accent);

            font-size: 10px;

            letter-spacing: .18em;

        }


        .project-title {

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size:
                clamp(45px, 5.5vw, 72px);

            font-weight: 500;

            line-height: .9;

            letter-spacing: -.04em;

        }


        .project-subtitle {

            color: var(--muted);

            font-size: 13.5px;

            line-height: 1.7;

            max-width: 420px;

        }


        /* =================================================
           MEDIA
        ================================================= */

        .project-media {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 2px;

            background: var(--line);

        }


        .media {

            position: relative;

            height: 600px;

            overflow: hidden;

            background: #d8d1c4;

        }


        /* =================================================
           ORIGINAL IMAGE
        ================================================= */

        .original-image {

            width: 100%;

            height: 100%;

            object-fit: cover;

            filter: saturate(.72);

            transition:
                transform 1.1s
                cubic-bezier(.2,.7,.2,1),
                filter .6s ease;

        }


        .media:hover .original-image {

            transform: scale(1.035);

            filter: saturate(1);

        }


        /* =================================================
           MEDIA LABEL
        ================================================= */

        .media-label {

            position: absolute;

            top: 18px;

            left: 18px;

            z-index: 20;

            padding: 8px 11px;

            background:
                rgba(0,0,0,.5);

            backdrop-filter: blur(5px);

            color: white;

            font-size: 8px;

            letter-spacing: .14em;

            text-transform: uppercase;

        }


        /* =================================================
           MODEL VIEWER
        ================================================= */

        .model-wrapper {

            width: 100%;

            height: 100%;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #e0dad0,
                    #c3bbae
                );

        }


        model-viewer {

            width: 100%;

            height: 100%;

            background: transparent;

            --poster-color: transparent;

        }


        .model-instruction {

            position: absolute;

            bottom: 18px;

            left: 18px;

            z-index: 20;

            padding: 8px 11px;

            background:
                rgba(0,0,0,.5);

            backdrop-filter: blur(5px);

            color: white;

            font-size: 8px;

            letter-spacing: .12em;

            text-transform: uppercase;

            pointer-events: none;

        }


        /* =================================================
           PROJECT INFORMATION
        ================================================= */

        .project-information {

            padding-top: 25px;

            display: grid;

            grid-template-columns:
                1fr 2fr;

            gap: 5vw;

        }


        .project-description {

            max-width: 680px;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.8;

        }


        /* =================================================
           DETAILS
        ================================================= */

        .project-details {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            border-top:
                1px solid var(--line);

        }


        .detail {

            padding: 15px 0;

            border-bottom:
                1px solid var(--line);

        }


        .detail:nth-child(odd) {

            margin-right: 25px;

        }


        .detail-label {

            display: block;

            margin-bottom: 7px;

            color: var(--accent);

            font-size: 8px;

            letter-spacing: .14em;

            text-transform: uppercase;

        }


        .detail-value {

            font-size: 12px;

        }


        /* =================================================
           WORKFLOW
        ================================================= */

        .workflow {

            margin-top: 55px;

            padding-top: 30px;

            border-top:
                1px solid var(--line);

        }


        .workflow-title {

            margin-bottom: 24px;

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size: 32px;

            font-weight: 500;

            line-height: 1;

        }


        .workflow-grid {

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            border-top:
                1px solid var(--line);

            border-left:
                1px solid var(--line);

        }


        .workflow-step {

            min-height: 125px;

            padding: 20px;

            border-right:
                1px solid var(--line);

            border-bottom:
                1px solid var(--line);

            transition:
                background .3s ease,
                color .3s ease;

        }


        .workflow-step:hover {

            background: var(--ink);

            color: var(--paper);

        }


        .workflow-number {

            color: var(--accent);

            font-size: 9px;

            letter-spacing: .14em;

        }


        .workflow-name {

            margin-top: 28px;

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size: 19px;

            line-height: 1.05;

        }


        /* =================================================
           BACK
        ================================================= */

        .back {

            padding: 90px 0;

            border-top:
                1px solid var(--line);

        }


        .back a {

            display: inline-block;

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size: 34px;

            transition:
                color .3s ease,
                transform .3s ease;

        }


        .back a:hover {

            color: var(--accent);

            transform:
                translateX(8px);

        }


        /* =================================================
           FOOTER
        ================================================= */

        footer {

            border-top:
                1px solid var(--line);

            padding:
                28px 0 48px;

            display: flex;

            justify-content: space-between;

            color: var(--muted);

            font-size: 10px;

            letter-spacing: .1em;

            text-transform: uppercase;

        }


        /* =================================================
           TABLET
        ================================================= */

        @media (max-width: 1000px) {

            .page-intro {

                grid-template-columns:
                    1fr 2fr;

            }


            .project-header {

                grid-template-columns:
                    70px 1.2fr 1fr;

            }


            .media {

                height: 520px;

            }


            .project-information {

                grid-template-columns:
                    1fr 1.5fr;

            }


            .workflow-grid {

                grid-template-columns:
                    repeat(5, 1fr);

            }


            .workflow-step {

                padding: 16px;

            }


            .workflow-name {

                font-size: 17px;

            }

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 800px) {

            .container {

                width: 90%;

            }


            /* HEADER */

            header {

                height: 68px;

            }


            .logo {

                font-size: 10px;

                letter-spacing: .13em;

            }


            .navigation {

                gap: 16px;

            }


            .navigation a {

                font-size: 8px;

                letter-spacing: .12em;

            }


            /* INTRO */

            .page-intro {

                padding:
                    75px 0 65px;

                display: block;

            }


            .page-intro-label {

                margin-bottom: 30px;

            }


            .page-intro h1 {

                font-size:
                    clamp(58px, 17vw, 78px);

            }


            .page-intro p {

                margin-top: 35px;

                font-size: 15px;

                line-height: 1.7;

            }


            /* PROJECTS */

            .projects {

                padding:
                    75px 0 90px;

            }


            .project {

                margin-bottom:
                    110px;

            }


            /* PROJECT HEADER */

            .project-header {

                display: block;

                margin-bottom: 25px;

            }


            .project-number {

                margin-bottom: 18px;

            }


            .project-title {

                font-size:
                    clamp(44px, 14vw, 62px);

                line-height: .88;

            }


            .project-subtitle {

                margin-top: 22px;

                max-width: 100%;

                font-size: 13px;

                line-height: 1.7;

            }


            /* MEDIA */

            .project-media {

                grid-template-columns:
                    1fr;

                gap: 2px;

            }


            .media {

                height:
                    min(78vw, 430px);

            }


            .media-label {

                top: 14px;

                left: 14px;

                font-size: 7px;

                padding: 7px 9px;

            }


            .model-instruction {

                bottom: 14px;

                left: 14px;

                font-size: 7px;

                padding: 7px 9px;

            }


            /* INFORMATION */

            .project-information {

                display: block;

                padding-top: 24px;

            }


            .project-description {

                font-size: 14px;

                line-height: 1.75;

                margin-bottom: 35px;

            }


            /* DETAILS */

            .project-details {

                grid-template-columns:
                    1fr 1fr;

            }


            .detail {

                padding: 14px 0;

            }


            .detail:nth-child(odd) {

                margin-right: 18px;

            }


            .detail-label {

                font-size: 7px;

            }


            .detail-value {

                font-size: 11px;

            }


            /* WORKFLOW */

            .workflow {

                margin-top: 45px;

                padding-top: 25px;

            }


            .workflow-title {

                font-size: 28px;

                margin-bottom: 20px;

            }


            .workflow-grid {

                grid-template-columns:
                    1fr 1fr;

            }


            .workflow-step {

                min-height: 105px;

                padding: 17px;

            }


            .workflow-name {

                margin-top: 24px;

                font-size: 18px;

            }


            /* BACK */

            .back {

                padding: 70px 0;

            }


            .back a {

                font-size: 27px;

            }


            /* FOOTER */

            footer {

                flex-direction: column;

                gap: 12px;

                padding:
                    24px 0 40px;

                font-size: 9px;

                line-height: 1.5;

            }

        }


        /* =================================================
           SMALL PHONES
        ================================================= */

        @media (max-width: 420px) {

            .navigation {

                gap: 12px;

            }


            .navigation a {

                font-size: 7px;

            }


            .page-intro h1 {

                font-size: 55px;

            }


            .project-title {

                font-size: 45px;

            }


            .media {

                height: 350px;

            }


            .project-details {

                grid-template-columns:
                    1fr;

            }


            .detail:nth-child(odd) {

                margin-right: 0;

            }


            .workflow-grid {

                grid-template-columns:
                    1fr;

            }


            .workflow-step {

                min-height: 100px;

            }


            .back a {

                font-size: 24px;

            }

        }


        /* =================================================
           REDUCED MOTION
        ================================================= */

        @media (prefers-reduced-motion: reduce) {

            html {

                scroll-behavior: auto;

            }

            body::before {

                display: none;

            }

            * {

                transition: none !important;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header>

        <a
            href="index.html"
            class="logo"
        >
            MASSINISSA NAIT
        </a>


        <nav class="navigation">

            <a href="index.html#work">
                Work
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </nav>

    </header>



    <!-- =================================================
         INTRO
    ================================================== -->

    <section class="page-intro">

        <div class="page-intro-label">

            01 · Selected Work

        </div>


        <div>

            <h1>

                Photo<br>
                grammetry.

            </h1>


            <p>

                Archaeological documentation and digital
                recording through image-based 3D reconstruction.
                From field photography to measurable digital
                models.

            </p>

        </div>

    </section>



    <!-- =================================================
         PROJECTS
    ================================================== -->

    <main
        id="projects"
        class="projects"
    ></main>



    <!-- =================================================
         BACK
    ================================================== -->

    <section class="back">

        <a href="index.html#work">

            ← Back to selected work

        </a>

    </section>



    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer>

        <span>
            © 2026 Massinissa Nait
        </span>

        <span>
            3D · Archaeology · Digital Heritage
        </span>

    </footer>


</div>



<script>

/* =========================================================
   PROJECT DATABASE

   ADD / REMOVE PROJECTS HERE
========================================================= */

const projects = [

    {
        number: "001",

        title: "Madaure",

        subtitle:
            "Archaeological documentation and photogrammetric reconstruction of archaeological remains.",

        original:
            "images/projects/photogrammetry/madaure-original.jpg",

        model:
            "images/projects/photogrammetry/madaure.glb",

        description:
            "Photogrammetric documentation of archaeological remains using overlapping photographic imagery to generate a three-dimensional digital representation of the site.",

        location:
            "Madaure · Algeria",

        software:
            "Agisoft Metashape",

        process:
            "Image-based 3D reconstruction",

        output:
            "Textured 3D model",

        workflow: [

            "Field Photography",

            "Image Alignment",

            "Dense Cloud",

            "Mesh Generation",

            "Textured Model"

        ]

    },


    {
        number: "002",

        title: "Cuicul",

        subtitle:
            "Photogrammetric documentation of archaeological architecture.",

        original:
            "images/projects/photogrammetry/cuicul-original.jpg",

        model:
            "images/projects/photogrammetry/cuicul.glb",

        description:
            "Digital documentation and three-dimensional reconstruction of archaeological architectural remains.",

        location:
            "Cuicul · Algeria",

        software:
            "Agisoft Metashape",

        process:
            "Photogrammetric reconstruction",

        output:
            "Textured 3D model",

        workflow: [

            "Photography",

            "Alignment",

            "Dense Cloud",

            "Mesh",

            "Texture"

        ]

    },


    {
        number: "003",

        title: "Project Three",

        subtitle:
            "Replace this with your project subtitle.",

        original:
            "images/projects/photogrammetry/project-03-original.jpg",

        model:
            "images/projects/photogrammetry/project-03.glb",

        description:
            "Replace this with your project description.",

        location:
            "Algeria",

        software:
            "Metashape",

        process:
            "Photogrammetry",

        output:
            "3D Model",

        workflow: [

            "Photography",

            "Alignment",

            "Dense Cloud",

            "Mesh",

            "Texture"

        ]

    }

];



/* =========================================================
   PROJECT CONTAINER
========================================================= */

const projectContainer =
    document.getElementById("projects");



/* =========================================================
   RENDER PROJECTS
========================================================= */

function renderProjects() {

    projectContainer.innerHTML = "";


    projects.forEach(project => {


        const workflowHTML =
            project.workflow
                .map((step, index) => `

                    <div class="workflow-step">

                        <div class="workflow-number">
                            ${String(index + 1).padStart(2, "0")}
                        </div>

                        <div class="workflow-name">
                            ${step}
                        </div>

                    </div>

                `)
                .join("");


        const projectHTML = `

            <article class="project">


                <!-- PROJECT HEADER -->

                <div class="project-header">

                    <div class="project-number">
                        ${project.number}
                    </div>


                    <h2 class="project-title">
                        ${project.title}
                    </h2>


                    <p class="project-subtitle">
                        ${project.subtitle}
                    </p>

                </div>



                <!-- ORIGINAL + 3D -->

                <div class="project-media">


                    <!-- ORIGINAL IMAGE -->

                    <div class="media">

                        <div class="media-label">
                            Original Record
                        </div>


                        <img
                            class="original-image"
                            src="${project.original}"
                            alt="Original photograph — ${project.title}"
                            loading="lazy"
                        >

                    </div>



                    <!-- 3D MODEL -->

                    <div class="media">

                        <div class="media-label">
                            Photogrammetry · 3D
                        </div>


                        <div class="model-wrapper">

                            <model-viewer

                                src="${project.model}"

                                alt="Interactive 3D photogrammetry model — ${project.title}"

                                camera-controls

                                auto-rotate

                                shadow-intensity="1"

                                exposure="1"

                                interaction-prompt="auto"

                                loading="lazy"

                            ></model-viewer>


                            <div class="model-instruction">

                                Drag · Rotate · Scroll to Zoom

                            </div>

                        </div>

                    </div>


                </div>



                <!-- INFORMATION -->

                <div class="project-information">


                    <div>

                        <p class="project-description">

                            ${project.description}

                        </p>

                    </div>



                    <div class="project-details">


                        <div class="detail">

                            <span class="detail-label">
                                Location
                            </span>

                            <span class="detail-value">
                                ${project.location}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                Software
                            </span>

                            <span class="detail-value">
                                ${project.software}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                Process
                            </span>

                            <span class="detail-value">
                                ${project.process}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                Output
                            </span>

                            <span class="detail-value">
                                ${project.output}
                            </span>

                        </div>


                    </div>

                </div>



                <!-- WORKFLOW -->

                <div class="workflow">

                    <h3 class="workflow-title">
                        Workflow
                    </h3>


                    <div class="workflow-grid">

                        ${workflowHTML}

                    </div>

                </div>


            </article>

        `;


        projectContainer.insertAdjacentHTML(
            "beforeend",
            projectHTML
        );

    });

}



/* =========================================================
   INITIALIZE
========================================================= */

renderProjects();

</script>


</body>

</html>
