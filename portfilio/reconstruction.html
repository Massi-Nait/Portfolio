<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Digital Reconstruction — Massinissa Nait
    </title>


    <meta
        name="description"
        content="Archaeological and architectural 3D reconstruction projects by Massinissa Nait."
    >


    <!-- =====================================================
         FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =================================================
           ROOT
        ================================================= */

        :root {

            --paper: #eee9df;
            --ink: #171715;
            --muted: #706d64;
            --line: #c9c2b6;
            --accent: #8a5039;

        }


        /* =================================================
           RESET
        ================================================= */

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            background: var(--paper);

            color: var(--ink);

            font-family: "DM Sans", sans-serif;

            overflow-x: hidden;

        }


        a {

            color: inherit;

            text-decoration: none;

        }


        button {

            font-family: inherit;

        }


        /* =================================================
           CONTAINER
        ================================================= */

        .container {

            width: min(1280px, 90%);

            margin: auto;

        }


        /* =================================================
           PAGE REVEAL
        ================================================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background: var(--ink);

            z-index: 9999;

            pointer-events: none;

            animation:
                pageReveal
                1.1s
                cubic-bezier(.77,0,.18,1)
                forwards;

        }


        @keyframes pageReveal {

            from {

                transform: translateY(0);

            }

            to {

                transform: translateY(-100%);

            }

        }


        /* =================================================
           HEADER
        ================================================= */

        header {

            height: 88px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom:
                1px solid var(--line);

        }


        .logo {

            font-size: 11px;

            font-weight: 600;

            letter-spacing: .15em;

            text-transform: uppercase;

        }


        .navigation {

            display: flex;

            gap: 32px;

        }


        .navigation a {

            position: relative;

            font-size: 10px;

            letter-spacing: .15em;

            text-transform: uppercase;

        }


        .navigation a::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: -7px;

            width: 0;

            height: 1px;

            background: var(--accent);

            transition: width .3s ease;

        }


        .navigation a:hover::after {

            width: 100%;

        }


        /* =================================================
           PAGE INTRO
        ================================================= */

        .page-intro {

            padding: 120px 0 100px;

            display: grid;

            grid-template-columns: 1fr 2fr;

            gap: 6vw;

            border-bottom:
                1px solid var(--line);

        }


        .page-label {

            color: var(--accent);

            font-size: 10px;

            letter-spacing: .18em;

            text-transform: uppercase;

        }


        .page-intro h1 {

            font-family:
                "Playfair Display",
                serif;

            font-size:
                clamp(60px, 8vw, 115px);

            font-weight: 500;

            line-height: .84;

            letter-spacing: -.06em;

        }


        .page-intro p {

            max-width: 680px;

            margin-top: 45px;

            color: var(--muted);

            font-size: 17px;

            line-height: 1.8;

        }


        /* =================================================
           RECONSTRUCTION AREA
        ================================================= */

        .reconstruction-area {

            display: grid;

            grid-template-columns: 260px 1fr;

            gap: 70px;

            padding: 100px 0 140px;

        }


        /* =================================================
           PROJECT INDEX
        ================================================= */

        .project-index {

            position: sticky;

            top: 40px;

            align-self: start;

        }


        .index-heading {

            margin-bottom: 25px;

            color: var(--muted);

            font-size: 9px;

            letter-spacing: .15em;

            text-transform: uppercase;

        }


        .project-list {

            display: flex;

            flex-direction: column;

            border-top:
                1px solid var(--line);

        }


        .project-button {

            width: 100%;

            padding: 17px 0;

            display: grid;

            grid-template-columns: 35px 1fr;

            gap: 10px;

            border: 0;

            border-bottom:
                1px solid var(--line);

            background: transparent;

            color: var(--ink);

            text-align: left;

            cursor: pointer;

            transition:
                color .25s ease,
                padding-left .25s ease;

        }


        .project-button:hover {

            color: var(--accent);

            padding-left: 6px;

        }


        .project-button.active {

            color: var(--accent);

            padding-left: 6px;

        }


        .project-button-number {

            font-size: 9px;

            letter-spacing: .12em;

        }


        .project-button-name {

            font-family:
                "Playfair Display",
                serif;

            font-size: 20px;

        }


        /* =================================================
           PROJECT CONTENT
        ================================================= */

        .project-content {

            min-width: 0;

            opacity: 1;

            transform: translateY(0);

            transition:
                opacity .35s ease,
                transform .35s ease;

        }


        .project-content.switching {

            opacity: 0;

            transform: translateY(20px);

        }


        /* =================================================
           PROJECT HEADER
        ================================================= */

        .project-number {

            color: var(--accent);

            font-size: 9px;

            letter-spacing: .16em;

        }


        .project-title {

            margin-top: 8px;

            font-family:
                "Playfair Display",
                serif;

            font-size:
                clamp(50px, 7vw, 95px);

            font-weight: 500;

            line-height: .85;

            letter-spacing: -.05em;

        }


        .project-introduction {

            max-width: 700px;

            margin-top: 30px;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.8;

        }


        /* =================================================
           REFERENCE IMAGE
        ================================================= */

        .reference-section {

            margin-top: 65px;

        }


        .section-label {

            margin-bottom: 18px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            color: var(--muted);

            font-size: 9px;

            letter-spacing: .15em;

            text-transform: uppercase;

        }


        .reference-image {

            width: 100%;

            height: 500px;

            object-fit: cover;

            display: block;

            filter: saturate(.7);

        }


        /* =================================================
           RECONSTRUCTION SLIDER
        ================================================= */

        .gallery-section {

            margin-top: 80px;

        }


        .gallery {

            position: relative;

            overflow: hidden;

            background: #d5cec1;

        }


        .gallery-image {

            display: block;

            width: 100%;

            height: 650px;

            object-fit: cover;

            user-select: none;

            -webkit-user-drag: none;

        }


        /* =================================================
           GALLERY CONTROLS
        ================================================= */

        .gallery-control {

            position: absolute;

            top: 50%;

            width: 55px;

            height: 55px;

            border: 1px solid rgba(255,255,255,.7);

            border-radius: 50%;

            background:
                rgba(0,0,0,.25);

            color: white;

            font-size: 18px;

            cursor: pointer;

            transform:
                translateY(-50%);

            backdrop-filter: blur(5px);

            transition:
                background .25s ease,
                transform .25s ease;

        }


        .gallery-control:hover {

            background:
                rgba(0,0,0,.55);

        }


        .gallery-prev {

            left: 25px;

        }


        .gallery-next {

            right: 25px;

        }


        /* =================================================
           GALLERY COUNTER
        ================================================= */

        .gallery-counter {

            position: absolute;

            right: 25px;

            bottom: 25px;

            padding: 9px 12px;

            background:
                rgba(0,0,0,.55);

            color: white;

            font-size: 9px;

            letter-spacing: .12em;

        }


        /* =================================================
           GALLERY CAPTION
        ================================================= */

        .gallery-caption {

            margin-top: 15px;

            display: flex;

            justify-content: space-between;

            gap: 30px;

            color: var(--muted);

            font-size: 11px;

            line-height: 1.6;

        }


        /* =================================================
           PROJECT METADATA
        ================================================= */

        .project-meta {

            margin-top: 60px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            border-top:
                1px solid var(--line);

        }


        .meta-item {

            padding: 18px 0;

            border-bottom:
                1px solid var(--line);

        }


        .meta-item:not(:nth-child(3n)) {

            margin-right: 25px;

        }


        .meta-label {

            display: block;

            margin-bottom: 8px;

            color: var(--accent);

            font-size: 8px;

            letter-spacing: .14em;

            text-transform: uppercase;

        }


        .meta-value {

            font-size: 12px;

        }


        /* =================================================
           BACK
        ================================================= */

        .back {

            padding: 100px 0;

            border-top:
                1px solid var(--line);

        }


        .back a {

            font-family:
                "Playfair Display",
                serif;

            font-size: 35px;

            transition:
                color .3s ease,
                transform .3s ease;

        }


        .back a:hover {

            color: var(--accent);

        }


        /* =================================================
           FOOTER
        ================================================= */

        footer {

            border-top:
                1px solid var(--line);

            padding: 30px 0 50px;

            display: flex;

            justify-content: space-between;

            color: var(--muted);

            font-size: 9px;

            letter-spacing: .08em;

            text-transform: uppercase;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 850px) {

            header {

                height: 70px;

            }


            .navigation {

                gap: 15px;

            }


            .navigation a {

                font-size: 8px;

            }


            .page-intro {

                padding: 80px 0 70px;

                grid-template-columns: 1fr;

                gap: 30px;

            }


            .page-intro h1 {

                font-size: 70px;

            }


            .reconstruction-area {

                grid-template-columns: 1fr;

                gap: 45px;

                padding: 70px 0 100px;

            }


            .project-index {

                position: static;

            }


            .project-list {

                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .project-button {

                padding: 14px 8px;

            }


            .reference-image {

                height: 350px;

            }


            .gallery-image {

                height: 450px;

            }


            .project-meta {

                grid-template-columns: 1fr;

            }


            .meta-item:not(:nth-child(3n)) {

                margin-right: 0;

            }


            footer {

                flex-direction: column;

                gap: 15px;

            }

        }


        /* =================================================
           SMALL MOBILE
        ================================================= */

        @media (max-width: 500px) {

            .project-list {

                grid-template-columns: 1fr;

            }


            .gallery-image {

                height: 350px;

            }


            .gallery-control {

                width: 45px;

                height: 45px;

            }


            .gallery-prev {

                left: 12px;

            }


            .gallery-next {

                right: 12px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header>

        <a
            href="index.html"
            class="logo"
        >
            MASSINISSA NAIT
        </a>


        <nav class="navigation">

            <a href="index.html#work">
                Work
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </nav>

    </header>



    <!-- =================================================
         PAGE INTRO
    ================================================== -->

    <section class="page-intro">

        <div class="page-label">

            02 · Digital Heritage

        </div>


        <div>

            <h1>

                Digital<br>
                Reconstruction.

            </h1>


            <p>

                Archaeological and architectural reconstruction
                through research, spatial analysis and
                three-dimensional interpretation.

            </p>

        </div>

    </section>



    <!-- =================================================
         RECONSTRUCTION WORKSPACE
    ================================================== -->

    <section class="reconstruction-area">


        <!-- =================================================
             PROJECT INDEX
        ================================================== -->

        <aside class="project-index">

            <div class="index-heading">

                Projects

            </div>


            <div
                class="project-list"
                id="projectList"
            ></div>

        </aside>



        <!-- =================================================
             PROJECT CONTENT
        ================================================== -->

        <main
            id="projectContent"
            class="project-content"
        ></main>


    </section>



    <!-- =================================================
         BACK
    ================================================== -->

    <section class="back">

        <a href="index.html#work">

            ← Back to selected work

        </a>

    </section>



    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer>

        <span>
            © 2026 Massinissa Nait
        </span>

        <span>
            3D · Archaeology · Digital Heritage
        </span>

    </footer>


</div>



<script>

/* =========================================================
   PROJECT DATABASE

   ADD YOUR PROJECTS HERE
========================================================= */

const projects = [


    /* =====================================================
       PROJECT 01
    ===================================================== */

    {

        number: "01",

        name: "Cuicul",

        title: "Cuicul",

        description:
            "Three-dimensional reconstruction of the central public quarter of ancient Cuicul, based on archaeological remains, architectural analysis and comparative evidence.",


        /* -------------------------------------------------
           REFERENCE IMAGE
        ------------------------------------------------- */

        reference:
            "images/projects/3D_reconstruction/cuicul-reference.jpg",


        referenceCaption:
            "Archaeological remains — Cuicul, Djemila",


        /* -------------------------------------------------
           RECONSTRUCTION GALLERY
        ------------------------------------------------- */

        gallery: [

            {
                image:
                    "images/projects/3D_reconstruction/cuicul-01.jpg",

                caption:
                    "Central public quarter — reconstructed view"
            },

            {
                image:
                    "images/projects/3D_reconstruction/cuicul-02.jpg",

                caption:
                    "Architectural reconstruction — frontal view"
            },

            {
                image:
                    "images/projects/3D_reconstruction/cuicul-03.jpg",

                caption:
                    "Reconstructed urban space"
            },

            {
                image:
                    "images/projects/3D_reconstruction/cuicul-04.jpg",

                caption:
                    "Interior architectural reconstruction"
            }

        ],


        /* -------------------------------------------------
           METADATA
        ------------------------------------------------- */

        location:
            "Djemila · Algeria",

        period:
            "Roman Period",

        software:
            "Blender",

        focus:
            "Architecture · Urbanism"


    },


    /* =====================================================
       PROJECT 02
       COPY THIS ENTIRE OBJECT TO ADD ANOTHER PROJECT
    ===================================================== */

    {

        number: "02",

        name: "Madaure",

        title: "Madaure",

        description:
            "Digital reconstruction and architectural visualization of the ancient site of Madaure.",


        reference:
            "images/projects/3D_reconstruction/madaure-reference.jpg",


        referenceCaption:
            "Archaeological remains — Madaure",


        gallery: [

            {
                image:
                    "images/projects/3D_reconstruction/madaure-01.jpg",

                caption:
                    "Reconstructed archaeological environment"
            },

            {
                image:
                    "images/projects/3D_reconstruction/madaure-02.jpg",

                caption:
                    "Architectural reconstruction"
            },

            {
                image:
                    "images/projects/3D_reconstruction/madaure-03.jpg",

                caption:
                    "Alternative reconstruction view"
            }

        ],


        location:
            "Madaure · Algeria",

        period:
            "Roman Period",

        software:
            "Blender",

        focus:
            "Architecture · Reconstruction"

    }


];



/* =========================================================
   ELEMENTS
========================================================= */

const projectList =
    document.getElementById("projectList");

const projectContent =
    document.getElementById("projectContent");



/* =========================================================
   CURRENT PROJECT
========================================================= */

let currentProject = 0;

let currentSlide = 0;



/* =========================================================
   CREATE PROJECT LIST
========================================================= */

function renderProjectList() {

    projectList.innerHTML = "";


    projects.forEach((project, index) => {

        const button =
            document.createElement("button");


        button.className =
            "project-button";


        if (index === currentProject) {

            button.classList.add("active");

        }


        button.innerHTML = `

            <span
                class="project-button-number"
            >
                ${project.number}
            </span>


            <span
                class="project-button-name"
            >
                ${project.name}
            </span>

        `;


        button.addEventListener(
            "click",
            () => {

                currentProject = index;

                currentSlide = 0;

                renderProjectList();

                renderProject();

            }
        );


        projectList.appendChild(button);

    });

}



/* =========================================================
   RENDER PROJECT
========================================================= */

function renderProject() {


    const project =
        projects[currentProject];


    projectContent.classList.add(
        "switching"
    );


    setTimeout(() => {


        projectContent.innerHTML = `

            <!-- =============================================
                 PROJECT TITLE
            ============================================== -->

            <div class="project-number">

                ${project.number}

            </div>


            <h2 class="project-title">

                ${project.title}

            </h2>


            <p class="project-introduction">

                ${project.description}

            </p>



            <!-- =============================================
                 REFERENCE
            ============================================== -->

            <section class="reference-section">

                <div class="section-label">

                    <span>
                        Archaeological Record
                    </span>

                    <span>
                        Reference
                    </span>

                </div>


                <img

                    class="reference-image"

                    src="${project.reference}"

                    alt="${project.referenceCaption}"

                >


                <div class="gallery-caption">

                    <span>
                        ${project.referenceCaption}
                    </span>

                </div>

            </section>



            <!-- =============================================
                 RECONSTRUCTION GALLERY
            ============================================== -->

            <section class="gallery-section">

                <div class="section-label">

                    <span>
                        3D Reconstruction
                    </span>

                    <span id="galleryCounter">
                        01 / ${project.gallery.length}
                    </span>

                </div>


                <div
                    class="gallery"
                    id="gallery"
                >


                    <img

                        id="galleryImage"

                        class="gallery-image"

                        src="${project.gallery[0].image}"

                        alt="${project.gallery[0].caption}"

                        draggable="false"

                    >


                    <button

                        class="gallery-control gallery-prev"

                        id="galleryPrev"

                        aria-label="Previous image"

                    >
                        ←
                    </button>


                    <button

                        class="gallery-control gallery-next"

                        id="galleryNext"

                        aria-label="Next image"

                    >
                        →
                    </button>


                    <div
                        class="gallery-counter"
                        id="galleryCounterBottom"
                    >

                        01 / ${project.gallery.length}

                    </div>


                </div>


                <div
                    class="gallery-caption"
                    id="galleryCaption"
                >

                    <span>
                        ${project.gallery[0].caption}
                    </span>

                    <span>
                        Drag / swipe to explore
                    </span>

                </div>

            </section>



            <!-- =============================================
                 METADATA
            ============================================== -->

            <div class="project-meta">


                <div class="meta-item">

                    <span class="meta-label">
                        Location
                    </span>

                    <span class="meta-value">
                        ${project.location}
                    </span>

                </div>


                <div class="meta-item">

                    <span class="meta-label">
                        Period
                    </span>

                    <span class="meta-value">
                        ${project.period}
                    </span>

                </div>


                <div class="meta-item">

                    <span class="meta-label">
                        Software
                    </span>

                    <span class="meta-value">
                        ${project.software}
                    </span>

                </div>


                <div class="meta-item">

                    <span class="meta-label">
                        Focus
                    </span>

                    <span class="meta-value">
                        ${project.focus}
                    </span>

                </div>


            </div>

        `;


        projectContent.classList.remove(
            "switching"
        );


        setupGallery();


    }, 250);

}



/* =========================================================
   GALLERY
========================================================= */

function setupGallery() {


    const project =
        projects[currentProject];


    const image =
        document.getElementById(
            "galleryImage"
        );


    const caption =
        document.getElementById(
            "galleryCaption"
        );


    const counter =
        document.getElementById(
            "galleryCounter"
        );


    const counterBottom =
        document.getElementById(
            "galleryCounterBottom"
        );


    const previous =
        document.getElementById(
            "galleryPrev"
        );


    const next =
        document.getElementById(
            "galleryNext"
        );


    function showSlide(index) {


        const total =
            project.gallery.length;


        currentSlide =
            (index + total) % total;


        const slide =
            project.gallery[currentSlide];


        image.src =
            slide.image;


        image.alt =
            slide.caption;


        caption.innerHTML = `

            <span>
                ${slide.caption}
            </span>

            <span>
                Drag / swipe to explore
            </span>

        `;


        const number =
            String(
                currentSlide + 1
            ).padStart(2, "0");


        counter.textContent =
            `${number} / ${String(total).padStart(2, "0")}`;


        counterBottom.textContent =
            `${number} / ${String(total).padStart(2, "0")}`;

    }


    previous.addEventListener(
        "click",
        () => {

            showSlide(
                currentSlide - 1
            );

        }
    );


    next.addEventListener(
        "click",
        () => {

            showSlide(
                currentSlide + 1
            );

        }
    );


    /* =============================================
       KEYBOARD
    ============================================== */

    document.onkeydown = event => {

        if (event.key === "ArrowLeft") {

            showSlide(
                currentSlide - 1
            );

        }


        if (event.key === "ArrowRight") {

            showSlide(
                currentSlide + 1
            );

        }

    };


    /* =============================================
       TOUCH / SWIPE
    ============================================== */

    let touchStartX = 0;

    let touchEndX = 0;


    image.addEventListener(
        "touchstart",
        event => {

            touchStartX =
                event.changedTouches[0].screenX;

        },
        {
            passive: true
        }
    );


    image.addEventListener(
        "touchend",
        event => {

            touchEndX =
                event.changedTouches[0].screenX;


            const difference =
                touchStartX - touchEndX;


            if (Math.abs(difference) < 50) {

                return;

            }


            if (difference > 0) {

                showSlide(
                    currentSlide + 1
                );

            } else {

                showSlide(
                    currentSlide - 1
                );

            }

        },
        {
            passive: true
        }
    );

}



/* =========================================================
   INITIALIZE
========================================================= */

renderProjectList();

renderProject();

</script>


</body>

</html>
